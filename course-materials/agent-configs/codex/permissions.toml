# Self-contained permission example; merge selected settings deliberately.
# Merge into $CODEX_HOME/config.toml (or ~/.codex/config.toml when CODEX_HOME is unset).
# Comment active sandbox_mode selectors and remove active [sandbox_workspace_write] tables from loaded layers.
# This file is a permissions example, separate from model/provider --profile presets.
# User default: normal sandbox in every project.
# Opt in to the defined course profile globally by changing this to "course-tools".
# A trusted project's .codex/config.toml can select course-tools only for that project.
# sandbox_mode = "danger-full-access" # Demonstration only: disables local sandbox restrictions.
# Do not keep any active sandbox_mode when using named permission profiles.
default_permissions = ":workspace"
approval_policy = "on-request"
# Default tool-output history budget; tools can override it and raw rollouts retain output.
tool_output_token_limit = 4000
approvals_reviewer = "auto_review" # Route eligible approval requests to the reviewer agent.
web_search = "cached" # Separate hosted capability, as in Claude's WebSearch allow.

[windows]
sandbox = "elevated"

[features]
# Tested course baseline; MXC requires a separate acceptance run.
prefer_mxc = false
# Explicitly off so merging this file also turns off a proxy enabled by an older user config.
# Only network_proxy = true enforces network.domains tables; the course profiles define none.
network_proxy = false

# Beta permission profiles; use instead of sandbox_mode / sandbox_workspace_write.
# Higher-precedence sandbox_mode/--sandbox can select legacy behavior; inspect the effective profile.
# See course-materials/agent-configs/codex/PERMISSIONS.md for scope and platform limits.
# Three profiles: course-tools (course VM default), course-workspace (strict, for real
# projects and laptops) and the optional read-only course-review.

# Opt-in course-tools profile: no OS deny-read for .env/secrets, by design; use only with synthetic course data.
# Why: since Codex 0.162.1 a profile with denied-read entries prevents unrestricted sandbox
# bypass, so the gh/Playwright allow rules in course.rules could not run on the host. On the
# course Windows VM (CLI 0.166.0) that host escalation failed under the strict deny-read profile
# and succeeded under course-tools. Keep no real secrets in a course workspace; for real
# projects or your own laptop select course-workspace instead.
[permissions.course-tools]
description = "Default course editing: workspace/temp writes, network enabled, no secret-file deny-read; rules allow selected host commands outside the sandbox."
extends = ":workspace"

[permissions.course-tools.network]
# Lets sandboxed commands use the network. No domain table on purpose: domain tables are
# enforced only with features.network_proxy = true, which the course keeps off.
enabled = true

[permissions.course-workspace]
description = "Strict editing: workspace/temp writes and network enabled; named .env files and secrets paths are denied."
extends = ":workspace"

[permissions.course-workspace.filesystem]
# Linux/WSL and native Windows snapshot deny-glob matches before sandbox startup.
# This is a scanning bound, not a guarantee about paths deeper than 12 levels.
glob_scan_max_depth = 12

[permissions.course-workspace.filesystem.":workspace_roots"]
# Exact denials also protect absent paths; keep them alongside bounded recursive globs.
".env" = "deny"
".env.local" = "deny"
".env.dev" = "deny"
".env.prod" = "deny"
".env.test" = "deny"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.dev" = "deny"
"**/.env.prod" = "deny"
"**/.env.test" = "deny"
"secrets" = "deny"
# Nested secrets/ folders only. The exact entry above already denies a root secrets file or
# folder with everything inside it; on Linux a second deny for files inside that denied folder
# stops bubblewrap from starting ("Can't create file at .../secrets/key.txt").
"*/**/secrets/**" = "deny"
# Logs are available to sandboxed search commands; there is no directory deny.
# A synthetic template is available for inspection but cannot be edited in this profile.
".env.example" = "read"

[permissions.course-workspace.network]
# Public network access for sandboxed commands; no domain table (no effect without the proxy).
# This does not request automatic review for every network connection.
enabled = true

# Optional read-only profile for analysis sessions.
# It extends :workspace, not course-workspace, and uses only glob denials: on Linux an exact
# deny entry for an absent file (e.g. .env.dev) makes bubblewrap create a mask file, which
# fails in a read-only workspace and stops the sandbox from starting. Globs match only files
# that exist when the session starts, and a read-only workspace lets nothing in the sandbox
# create new ones, so existing .env/secrets files stay unreadable.
[permissions.course-review]
description = "Strict review: workspace read-only, existing .env/secrets files denied, temporary directories writable."
extends = ":workspace"

[permissions.course-review.filesystem]
glob_scan_max_depth = 12

[permissions.course-review.filesystem.":workspace_roots"]
"." = "read"
# "**/" also matches the workspace root itself (verified with Codex CLI 0.170.0 on Linux).
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.dev" = "deny"
"**/.env.prod" = "deny"
"**/.env.test" = "deny"
"**/secrets" = "deny"
"**/secrets/**" = "deny"
# Temporary directories inherited from :workspace remain writable.

[permissions.course-review.network]
# Same as course-workspace: sandboxed commands may use the network; no domain table.
enabled = true

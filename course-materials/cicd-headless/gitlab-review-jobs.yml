# PR-Agent and Codex CLI review jobs for one GitLab merge request, in one includable file.
# Include it from .gitlab-ci.yml and add "review" to the root stages; see gitlab-review-jobs.md.
# Variables: masked REVIEW_API_KEY, OPENROUTER_API_KEY, GITLAB__PERSONAL_ACCESS_TOKEN and
# GITLAB_TOKEN, plus CODEX_REVIEW_IMAGE (the agent-review image in your registry).
# Both jobs ran on self-managed GitLab 19.5.3 with a Docker runner (10.11.2026); needs: [] was
# added after 20.11.2026, when review jobs waited for a red build and never started.

pr-agent-review:
  stage: review
  image:
    name: pragent/pr-agent:0.47.0@sha256:7d98954c29289846a08faf00aaea0f1f1375b1676cd8a2ed303e0af07010af7a
    entrypoint: [""]
  needs: []           # run even when build or test jobs fail
  before_script: []   # do not inherit the project's default before_script/cache
  cache: []
  variables:
    GIT_STRATEGY: none
    CONFIG__GIT_PROVIDER: gitlab
    CONFIG__FALLBACK_MODELS: '[]'
    CONFIG__RESTRICTED_MODE: 'true'
    CONFIG__PROPAGATE_TOOL_ERRORS: 'true'
    CONFIG__USE_REPO_SETTINGS_FILE: 'false'    # the MR branch cannot change the reviewer's settings
    CONFIG__USE_GLOBAL_SETTINGS_FILE: 'false'
    CONFIG__REPO_CONTEXT_FILES: '[]'
    CONFIG__PUBLISH_OUTPUT: 'true'
    CONFIG__OUTPUT_RUN_DETAILS: 'true'
    CONFIG__REASONING_EFFORT: low
    PR_REVIEWER__PERSISTENT_COMMENT: 'true'
    PR_REVIEWER__FINAL_UPDATE_MESSAGE: 'false'
    PR_REVIEWER__INLINE_KEY_ISSUES: 'false'
    PR_REVIEWER__ENABLE_REVIEW_LABELS_EFFORT: 'false'
    PR_REVIEWER__ENABLE_REVIEW_LABELS_SECURITY: 'false'
    PR_REVIEWER__NUM_MAX_FINDINGS: '5'
    PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: 'true'
    PR_REVIEWER__MAX_NUMBER_OF_CALLS: '4'
    # Adapt to your project: what to look for and what not to claim.
    PR_REVIEWER__EXTRA_INSTRUCTIONS: |
      Review new correctness, security and error-handling defects.
      Give the failing scenario, source evidence and an actionable fix in concise English.
      Never claim that checks you did not run have passed.
  script:
    - |
      set -eu
      : "${REVIEW_API_KEY:?Set masked variable REVIEW_API_KEY (model endpoint API key)}"
      : "${GITLAB__PERSONAL_ACCESS_TOKEN:?Set masked variable GITLAB__PERSONAL_ACCESS_TOKEN (GitLab bot token)}"
      # Any OpenAI-compatible endpoint; "openai/" selects PR-Agent's OpenAI-compatible client.
      export OPENAI__KEY="$REVIEW_API_KEY"
      export OPENAI__API_BASE="${REVIEW_API_BASE:-https://openrouter.ai/api/v1}"
      MODEL="openai/${REVIEW_MODEL:-openai/gpt-6-luna}"
      export CONFIG__MODEL="$MODEL"
      export CONFIG__CUSTOM_MODEL_MAX_TOKENS="${REVIEW_MAX_TOKENS:-250000}"
      export CONFIG__MAX_MODEL_TOKENS="${REVIEW_MAX_TOKENS:-250000}"
      export CONFIG__NO_TEMPERATURE_MODELS="[\"$MODEL\"]"
      export CONFIG__ADDITIONAL_REASONING_EFFORT_MODELS="[\"$MODEL\"]"
      export GITLAB__URL="$CI_SERVER_URL"
      PR_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
      cd /app
      python -m pr_agent.cli --pr_url "$PR_URL" review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: manual
    - when: never
  allow_failure: true # Advisory; errors remain visible in this job's log.

codex-review:
  stage: review
  image: "$CODEX_REVIEW_IMAGE"
  needs: []           # run even when build or test jobs fail
  before_script: []
  cache: []
  allow_failure: true # Advisory: a green pipeline does not prove that a comment was posted.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: manual
    - when: never
  variables:
    GIT_DEPTH: "0"
    AGENT: codex
    LLM_PROVIDER: openrouter
    REVIEW_MODEL: openai/gpt-6-luna
    # Codex's Linux sandbox (bubblewrap) cannot create namespaces in a default Docker job.
    # The job container is the boundary here; use spend-limited keys and an isolated pilot.
    CODEX_SANDBOX: danger-full-access
  script:
    - bash ci/agent-review/agent_review.sh "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ci/agent-review/prompts/code-review.md
    - bash ci/agent-review/post_review_comment.sh .agent-review/review.md
  artifacts:
    when: always
    paths: [.agent-review/]
    expire_in: 3 days
